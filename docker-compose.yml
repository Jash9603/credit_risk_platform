services:
  db:
    image: postgres:16-alpine
    container_name: credit_risk_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-credit_risk}
      POSTGRES_USER: ${POSTGRES_USER:-credit_risk_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-credit_risk_app} -d ${POSTGRES_DB:-credit_risk}"]
      interval: 5s
      timeout: 5s
      retries: 10

# api and web services are added once the backend and frontend exist.

volumes:
  pgdata:
