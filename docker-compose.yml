services:
  db:
    image: postgres:16-alpine
    container_name: credit_risk_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-credit_risk}
      POSTGRES_USER: ${POSTGRES_USER:-credit_risk_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-credit_risk_app} -d ${POSTGRES_DB:-credit_risk}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: credit_risk_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-credit_risk}
      - POSTGRES_USER=${POSTGRES_USER:-credit_risk_app}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_me}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CORS_ORIGINS=http://localhost:5173,http://localhost,http://localhost:80
    volumes:
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:${API_PORT:-8000}
    container_name: credit_risk_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
